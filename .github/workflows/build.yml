name: Build

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: erlef/setup-beam@v1
        with:
          gleam-version: 'latest'
      - run: bun install
      - run: bun run test
      - run: bun run build
